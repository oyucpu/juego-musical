  <style>
    :root {
      --bg-dark: #0a0512;
      --card-bg: #160d29;
      --accent-aitana: #ff2a85;
      --accent-mafalda: #7000ff;
      --accent-desamor: #00b8d9;
      --accent-gold: #ffb703;
      --accent-green: #00e676;
      --text-main: #f8f9fa;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 42, 133, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.15) 0%, transparent 40%);
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff2a85, #ffb703, #7000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .controls-panel {
      background: rgba(22, 13, 41, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 18px;
      width: 100%;
      max-width: 1050px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn, select.btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .btn:hover, select.btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn.active {
      background: linear-gradient(135deg, var(--accent-aitana), var(--accent-mafalda));
      border-color: transparent;
    }

    .level-badge {
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
    }

    select.btn option {
      background: var(--card-bg);
      color: var(--text-main);
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .stat-val {
      color: var(--accent-gold);
    }

    /* Grid Adaptativo */
    .game-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      perspective: 1000px;
      margin-bottom: 30px;
    }

    /* Cartas 3D */
    .card {
      aspect-ratio: 3/4;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.4s ease;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    /* Estado de acierto (Matched) */
    .card.matched {
      transform: rotateY(180deg) scale(0.96);
      -webkit-transform: rotateY(180deg) scale(0.96);
      cursor: default;
      pointer-events: none;
      animation: matchPulse 0.4s ease-out;
    }

    @keyframes matchPulse {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(0.96); }
    }

    .card.matched .card-front {
      border: 2px solid var(--accent-green) !important;
      background: linear-gradient(145deg, #0d2818, #051a0e) !important;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4), inset 0 0 12px rgba(0, 230, 118, 0.2) !important;
    }

    .card.matched .song-title-text {
      color: #e8ffea !important;
      font-weight: 800;
    }

    .card.matched .matched-indicator {
      display: block !important;
    }

    .matched-indicator {
      display: none;
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--accent-green);
      margin-top: 6px;
      background: rgba(0, 230, 118, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* Fuerza una cara 3D independiente: evita que Firefox pinte el reverso al girar */
      transform: rotateY(0deg) translateZ(0.1px);
      -webkit-transform: rotateY(0deg) translateZ(0.1px);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.12);
    }

    .card-back {
      background: linear-gradient(145deg, #1f1238, #0e071c);
      /* No usar z-index entre las caras: puede provocar artefactos en Firefox */
    }

    .card-back::after {
      content: '🎵';
      font-size: 1.8rem;
    }

    .card-front {
      background: var(--card-bg);
      transform: rotateY(180deg) translateZ(0.2px);
      -webkit-transform: rotateY(180deg) translateZ(0.2px);
    }

    .card.aitana .card-front { border-color: var(--accent-aitana); }
    .card.mafalda .card-front { border-color: var(--accent-mafalda); }
    .card.desamor .card-front { border-color: var(--accent-desamor); }

    .artist-badge {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .card.aitana .artist-badge { background: rgba(255, 42, 133, 0.25); color: var(--accent-aitana); }
    .card.mafalda .artist-badge { background: rgba(112, 0, 255, 0.25); color: #b17aff; }
    .card.desamor .artist-badge { background: rgba(0, 184, 217, 0.25); color: #4dd8f0; }

    .emoji-riddle { font-size: 1.5rem; line-height: 1.2; font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif; }
    .song-title-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--text-main); }

    /* Modal de Nivel Completado */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 18, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: #160d29; border: 2px solid var(--accent-gold);
      padding: 25px; border-radius: 24px; text-align: center;
      max-width: 400px; width: 90%;
      box-shadow: 0 0 30px rgba(255, 183, 3, 0.3);
    }

    /* Modo Estudio */
    .study-container {
      display: none; width: 100%; max-width: 400px;
      flex-direction: column; align-items: center; gap: 18px;
    }

    .flashcard {
      width: 100%; aspect-ratio: 4/3; position: relative;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      transition: transform 0.5s ease; cursor: pointer;
    }

    .flashcard.flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }

    .flashcard-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 20px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
      text-align: center; background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .flashcard-front { border-color: var(--accent-aitana); }
    .flashcard-back { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); border-color: var(--accent-mafalda); }

    .flashcard .emoji-display { font-size: 3rem; margin-bottom: 12px; font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif; }
    .flashcard .title-display { font-size: 1.3rem; font-family: 'Outfit', sans-serif; font-weight: 800; }

    .study-nav { display: flex; gap: 12px; width: 100%; justify-content: center; }

    .badge-aitana { background: rgba(255, 42, 133, 0.25); color: var(--accent-aitana); }
    .badge-mafalda { background: rgba(112, 0, 255, 0.25); color: #b17aff; }
    .badge-desamor { background: rgba(0, 184, 217, 0.25); color: #4dd8f0; }
    .flashcard-face .artist-badge { font-size: 0.7rem; margin-bottom: 12px; }
  </style>
</head>

  </header>

  <div class="controls-panel">
    <div class="control-group">
      <button class="btn active" id="btnModeGame" onclick="switchMode('game')">🎮 Juego</button>
      <button class="btn" id="btnModeStudy" onclick="switchMode('study')">📚 Estudio</button>
      <button class="btn" id="btnAudio" onclick="toggleAudio()">🔊 Sonido: ON</button>
    </div>

    <div class="control-group" id="gameFilters">
      <span class="level-badge" id="levelDisplay">Nivel 1 (4 Parejas)</span>
      <select class="btn" id="artistFilter" onchange="resetProgression()">
        <option value="all" id="optAll">Todas las Artistas</option>
        <option value="aitana" id="optAitana">Solo Aitana</option>
        <option value="mafalda" id="optMafalda">Solo Mafalda</option>
        <option value="desamor" id="optDesamor">💔 Solo Desamor</option>
        <option value="mix" id="optMix">Todo mezclado</option>
      </select>
      <button class="btn" onclick="resetProgression()">🔄 Reiniciar</button>
    </div>

    <div class="stats-bar" id="gameStats">
      <div>⏱️ <span class="stat-val" id="timeCount">00:00</span></div>
      <div>🎯 Movs: <span class="stat-val" id="moveCount">0</span></div>
      <div>✨ Aciertos: <span class="stat-val" id="matchCount">0</span></div>
    </div>
  </div>

  <!-- Tablero del Juego -->
  <div class="game-container" id="gameBoard"></div>

  <!-- Modo Estudio -->
  <div class="study-container" id="studyBoard">
    <div class="flashcard" id="flashcard" onclick="flipFlashcard()">

        <span class="artist-badge" id="fcArtist">Aitana</span>
        <div class="emoji-display" id="fcEmoji">🗣️❌💬</div>

      </div>
      <div class="flashcard-face flashcard-back">
        <span class="artist-badge" id="fcArtistBack">Aitana</span>
        <div class="title-display" id="fcTitle">No Hablamos El Mismo Idioma</div>
      </div>
    </div>
    <div class="study-nav">
      <button class="btn" onclick="prevFlashcard()">⬅️ Anterior</button>
      <span class="btn" id="fcProgress" style="cursor: default;">1 / 1</span>
      <button class="btn" onclick="nextFlashcard()">Siguiente ➡️</button>
    </div>
  </div>

  <!-- Modal de Nivel Completado -->
  <div class="modal-overlay" id="victoryModal">

      { id: 'd244', artist: 'desamor', singer: "Alejandro Sanz", title: "Amiga Mía", emoji: '👩💭🥀' }
    ];

    // CONFIGURACIÓN DE NIVELES PROGRESIVOS
    const PROGRESSION_LEVELS = [
      { level: 1, pairs: 4, name: 'Nivel 1 (4 Parejas)' },
      { level: 2, pairs: 6, name: 'Nivel 2 (6 Parejas)' },
      { level: 3, pairs: 10, name: 'Nivel 3 (10 Parejas)' },
      { level: 4, pairs: 16, name: 'Nivel 4 (16 Parejas)' },
      { level: 5, pairs: 24, name: 'Nivel 5 — Maestro (24 Parejas)' }
    ];

    let currentLevelIndex = 0;
    let audioEnabled = true;
    let moves = 0;
    let matches = 0;
    let totalPairs = 0;
    let flippedCards = [];
    let lockBoard = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let studyIndex = 0;
    let studyList = [];

    // Sintetizador de Sonido
    let audioCtx = null;

    function playSound(type) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'flip') {
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'match') {
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').textContent = `🔊 Sonido: ${audioEnabled ? 'ON' : 'OFF'}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      updateTimeDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimeDisplay();
      }, 1000);
    }

    function updateTimeDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timeCount').textContent = `${mins}:${secs}`;
    }

    function switchMode(mode) {
      document.getElementById('btnModeGame').classList.toggle('active', mode === 'game');
      document.getElementById('btnModeStudy').classList.toggle('active', mode === 'study');
      
      document.getElementById('gameBoard').style.display = mode === 'game' ? 'grid' : 'none';
      document.getElementById('gameFilters').style.display = mode === 'game' ? 'flex' : 'none';
      document.getElementById('gameStats').style.display = mode === 'game' ? 'flex' : 'none';
      document.getElementById('studyBoard').style.display = mode === 'study' ? 'flex' : 'none';

      if (mode === 'study') {
        clearInterval(timerInterval);
        initStudyMode();
      } else {
        initGame();
      }
    }

    function resetProgression() {
      currentLevelIndex = 0;
      initGame();
    }

    function initGame() {
      const board = document.getElementById('gameBoard');
      board.innerHTML = '';
      
      const currentConfig = PROGRESSION_LEVELS[currentLevelIndex];
      document.getElementById('levelDisplay').textContent = currentConfig.name;

      moves = 0;
      matches = 0;
      flippedCards = [];
      lockBoard = false;
      document.getElementById('moveCount').textContent = moves;
      document.getElementById('matchCount').textContent = matches;

      startTimer();

      const artistFilter = document.getElementById('artistFilter').value;
      let pool = SONGS_DATABASE.filter(s => artistFilter === 'mix' || (artistFilter === 'all' ? s.artist !== 'desamor' : s.artist === artistFilter));

      totalPairs = Math.min(currentConfig.pairs, pool.length);
      const selected = shuffle(pool).slice(0, totalPairs);
      if (totalPairs === 0) {
        board.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted)">No hay canciones para mostrar.</p>';
        clearInterval(timerInterval);
        return;
      }

      // Cada canción genera dos cartas: una con el emoji y otra con el título
      const deck = [];
      selected.forEach(song => {
        deck.push({ song, type: 'emoji' });
        deck.push({ song, type: 'title' });
      });

      shuffle(deck).forEach(item => board.appendChild(createCard(item)));
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function createCard({ song, type }) {
      const card = document.createElement('div');
      card.className = `card ${song.artist}`;
      card.dataset.id = song.id;

      const artistName = song.singer || (song.artist === 'aitana' ? 'Aitana' : 'Mafalda');
      const content = type === 'emoji'
        ? `<div class="emoji-riddle">${song.emoji}</div>`
        : `<div class="song-title-text">${song.title}</div>`;

      card.innerHTML = `
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <span class="artist-badge">${artistName}</span>
          ${content}
          <div class="matched-indicator">✓ ¡Acierto!</div>
        </div>
      `;

      card.addEventListener('click', () => flipCard(card));
      return card;
    }

    function flipCard(card) {
      if (lockBoard) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      playSound('flip');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moveCount').textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [first, second] = flippedCards;

      if (first.dataset.id === second.dataset.id) {
        // Acierto
        lockBoard = true;
        setTimeout(() => {
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          first.classList.add('matched');
          second.classList.add('matched');
          playSound('match');

          matches++;
          document.getElementById('matchCount').textContent = matches;
          flippedCards = [];
          lockBoard = false;

          if (matches === totalPairs) {
            setTimeout(showVictory, 600);
          }
        }, 400);
      } else {
        // Fallo
        lockBoard = true;
        setTimeout(() => {
          playSound('wrong');
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 900);
      }
    }

    function showVictory() {
      clearInterval(timerInterval);
      const isLast = currentLevelIndex === PROGRESSION_LEVELS.length - 1;

      document.getElementById('finalTime').textContent = document.getElementById('timeCount').textContent;
      document.getElementById('finalMoves').textContent = moves;
      document.getElementById('modalHeading').textContent = isLast ? '¡Eres una Maestra! 👑' : '¡Nivel Superado! 🎉';
      document.getElementById('modalSubtext').textContent = isLast
        ? 'Has completado todos los niveles. ¡Increíble!'
        : 'Has descifrado todas las canciones de este nivel.';
      document.getElementById('btnNextLevel').textContent = isLast ? 'Jugar de nuevo 🔄' : 'Siguiente Nivel ➡️';

      document.getElementById('victoryModal').classList.add('active');
    }

    function nextLevel() {
      document.getElementById('victoryModal').classList.remove('active');
      if (currentLevelIndex < PROGRESSION_LEVELS.length - 1) {
        currentLevelIndex++;
      } else {
        currentLevelIndex = 0;
      }
      initGame();
    }

    // MODO ESTUDIO
    function initStudyMode() {
      studyList = SONGS_DATABASE.slice();
      studyIndex = 0;
      renderFlashcard();
    }

    function renderFlashcard() {
      if (!studyList.length) {
        document.getElementById('fcArtist').textContent = 'Sin canciones';
        document.getElementById('fcArtistBack').textContent = 'Sin canciones';
        document.getElementById('fcEmoji').textContent = '🎵';
        document.getElementById('fcTitle').textContent = 'No hay canciones disponibles';
        document.getElementById('fcProgress').textContent = '0 / 0';
        return;
      }
      const song = studyList[studyIndex];
      const artistName = song.singer || (song.artist === 'aitana' ? 'Aitana' : 'Mafalda');
      const badgeClass = `artist-badge badge-${song.artist}`;

      document.getElementById('flashcard').classList.remove('flipped');
      document.getElementById('fcArtist').textContent = artistName;
      document.getElementById('fcArtist').className = badgeClass;
      document.getElementById('fcArtistBack').textContent = artistName;
      document.getElementById('fcArtistBack').className = badgeClass;
      document.getElementById('fcEmoji').textContent = song.emoji;
      document.getElementById('fcTitle').textContent = song.title;
      document.getElementById('fcProgress').textContent = `${studyIndex + 1} / ${studyList.length}`;
    }

    function flipFlashcard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function nextFlashcard() {
      studyIndex = (studyIndex + 1) % studyList.length;
      renderFlashcard();
    }

    function prevFlashcard() {
      studyIndex = (studyIndex - 1 + studyList.length) % studyList.length;
      renderFlashcard();
    }

    function updateCounts() {
      const nA = SONGS_DATABASE.filter(x => x.artist === 'aitana').length;
      const nM = SONGS_DATABASE.filter(x => x.artist === 'mafalda').length;
      const nD = SONGS_DATABASE.filter(x => x.artist === 'desamor').length;
      document.getElementById('subtitleText').textContent = `Emoji Song Match — ${nA + nM + nD} Canciones Únicas`;
      document.getElementById('optAll').textContent = `Aitana + Mafalda (${nA + nM})`;
      document.getElementById('optDesamor').textContent = `💔 Solo Desamor (${nD})`;
      document.getElementById('optMix').textContent = `Todo mezclado (${nA + nM + nD})`;
      document.getElementById('optAitana').textContent = `Solo Aitana (${nA})`;
      document.getElementById('optMafalda').textContent = `Solo Mafalda (${nM})`;
    }

    // Arranque
    updateCounts();
    initGame();
  </script>
